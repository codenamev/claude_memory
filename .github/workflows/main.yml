name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Fetch git-lfs objects so `.claude/memory.sqlite3` resolves to the
          # real SQLite file rather than a pointer text blob. The signal-health
          # benchmark (spec/benchmarks/health/database_signal_spec.rb) reads
          # the live committed DB to catch in-conversation contamination; it
          # errors with "file is not a database" if checkout leaves an LFS
          # pointer behind. The spec itself skips gracefully when the pointer
          # is unresolved, so this flag preserves the intended coverage when
          # LFS is healthy without making the spec a flaky CI dependency.
          lfs: true
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Optional: Run evals with summary report (makes results visible in logs)
      - name: Run evals with summary
        run: ./bin/run-evals

      # Run full test suite (includes evals again, but that's fine)
      - name: Run tests and linter
        run: bundle exec rake
