name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Leave LFS off (the default). `.claude/memory.sqlite3` is
          # LFS-tracked but the project's LFS blobs aren't reliably present
          # on the GitHub LFS server, so enabling `lfs: true` hard-fails
          # checkout with `Object does not exist on the server [404]`. The
          # signal-health benchmark (spec/benchmarks/health/) skips itself
          # when it sees an LFS-pointer file instead of a SQLite header, so
          # CI still passes; the benchmark must be run locally (where `git
          # lfs pull` resolves the pointer) to validate signal contracts.
          # See docs/api_stability.md §7.
          lfs: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Optional: Run evals with summary report (makes results visible in logs)
      - name: Run evals with summary
        run: ./bin/run-evals

      # Run full test suite (includes evals again, but that's fine)
      - name: Run tests and linter
        run: bundle exec rake
