name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '4.0.1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Optional: Run evals with summary report (makes results visible in logs)
      - name: Run evals with summary
        run: ./bin/run-evals

      # Run full test suite (includes evals again, but that's fine)
      - name: Run tests and linter
        run: bundle exec rake
