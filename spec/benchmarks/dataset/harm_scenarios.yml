  memory_facts:
    - id: ref_lambda_handler
      subject: claude_memory
      predicate: architecture
      object: >
        Webhook receivers are AWS Lambda handlers wired through API
        Gateway. The handler signature is `def handler(event, context):
        ...` and the deployment is via SAM or Serverless framework.
        Cold-start latency is bounded by package size; keep deps slim.
      text: >
