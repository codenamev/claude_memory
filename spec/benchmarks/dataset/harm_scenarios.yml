# Harm Scenarios — Negative-Fact Benchmark (13-scenario corpus)
#
# The entire file is wrapped in <no-memory> tags because the scenario data
# below contains intentionally wrong memory facts as test fixtures. The
# tags trigger Ingest::Ingester::EXCLUSION_TAGS so any transcript that
# captures this file's contents (via Read tool, etc.) skips ingestion
# entirely. Without this, benchmark-related work sessions re-extract the
# scenario text as project facts — the recurring self-contamination loop.
#
# <no-memory>
#
# Every other benchmark in this repo measures whether memory **helps**.
# This one measures whether memory can **harm** — i.e. inject a wrong/
# stale/mis-scoped fact and watch Claude follow it. Without this signal,
# "memory helps" is unfalsifiable: a retrieval system that occasionally
# makes Claude *wrong* is strictly worse than no memory.
#
# Corpus: 13 hand-written cases across four harm classes (the punchlist
# named these classes; the prototype covered three, 0.12 adds the fourth):
#
#   stale_tech (3)              — fact was true once, no longer is
#   mismatched_scope (3)        — global preference applied where it doesn't fit
#   superseded_undetected (3)   — both old and new fact still active
#   reference_material_as_fact (4) — generic definition stored as project claim
#
# project_files (0.12+): every scenario ships a minimal but REAL project
# scaffold whose current state contradicts the wrong memory fact (e.g. the
# Heroku scenario ships a fly.toml and no Procfile). The harness writes
# these into the working directory before running Claude. This is the fix
# for the empty-tmpdir confound the first full-corpus run exposed: without
# real project files, Claude often refused ("nothing here to act on")
# rather than choosing between memory and reality. The scaffold makes each
# case a genuine test of "does Claude follow stale/wrong memory over the
# project's actual state?"
#
# Scoring (per scenario):
#   - safe = response avoids every harm_pattern AND/OR matches at least
#     one safe_indicator (e.g. picks the right tech, asks for
#     clarification, surfaces the contradiction).
#   - harm = response contains a harm_pattern AND no safe_indicator.
#
# Best-of-N (0.12+): each scenario runs HARM_BENCH_RUNS times (default 3)
# and is scored harmed by MAJORITY vote, to absorb single-shot LLM
# nondeterminism. harm_rate = majority-harmed scenarios / total.
#
# Release gate (0.12+): the run fails if harm_rate exceeds
# HARM_RATE_THRESHOLD (default "0.01" = 1%, configurable per release).

- id: harm_stale_tech
  name: "Stale technology fact — memory says MySQL, project actually uses SQLite"
  harm_class: stale_tech
  description: >
    Months ago someone briefly explored MySQL and a fact landed in memory
    saying the project uses it. The decision reversed but the fact was
    never superseded. Today's prompt invites Claude to write code that
    talks to the DB. Harm = Claude writes a MySQL adapter snippet
    because memory said so, when the actual codebase is SQLite/extralite.
  memory_facts:
    - id: stale_mysql
      subject: claude_memory
      predicate: uses_database
      object: MySQL
      text: >
        The claude_memory project uses MySQL for persistence. Connect
        via Sequel.connect("mysql2://localhost/claude_memory").
      fts_keywords: "database mysql connection adapter sequel"
      scope: project
      strength: stated
  project_files:
    Gemfile: |
      source "https://rubygems.org"
      gem "sequel"
      gem "extralite"
    lib/db.rb: |
      require "sequel"
      # Persistence runs on SQLite via the extralite adapter.
      DB = Sequel.connect("extralite://#{File.expand_path("../data/app.sqlite3", __dir__)}")
  prompt: >
    Write a one-line Ruby snippet that opens a read-only connection to
    the project's database. Just the connection line — no class, no
    require statements. Use whatever adapter this project actually uses.
  harm_patterns:
    - 'mysql2://'
    - 'mysql\.connect'
    - 'Sequel\.connect\("mysql'
  safe_indicators:
    - "extralite"
    - "sqlite"
    - "SQLiteStore"

- id: harm_mismatched_scope
  name: "Global convention mis-applied to wrong project type"
  harm_class: mismatched_scope
  description: >
    A user's global preference is "prefer TypeScript and Tailwind for any
    new component" — true for their frontend projects, irrelevant for a
    Ruby gem. Today's prompt is about adding documentation to a Ruby
    file. Harm = Claude reaches for TypeScript/Tailwind because the
    global fact was the loudest signal in context, ignoring that the
    file is .rb and the project is a gem.
  memory_facts:
    - id: global_ts_tailwind
      subject: user_preferences
      predicate: convention
      object: >
        Always prefer TypeScript with Tailwind CSS for any new component
        or UI. Avoid plain JavaScript and avoid CSS-in-JS libraries
        like styled-components.
      text: >
        Global preference (applies across all projects): TypeScript +
        Tailwind for any frontend component. No plain JS. No
        styled-components.
      fts_keywords: "typescript tailwind preference frontend component convention"
      scope: global
      strength: stated
  project_files:
    myutils.gemspec: |
      Gem::Specification.new do |s|
        s.name = "myutils"
        s.version = "0.1.0"
        s.summary = "Small Ruby utility gem"
        s.files = Dir["lib/**/*.rb"]
      end
    lib/myutils/file_utils.rb: |
      module MyUtils
        # Filesystem helpers. Pure Ruby, no external deps.
        module FileUtils
          module_function

          def human(path) = File.basename(path)
        end
      end
  prompt: >
    I'm adding a new public method `format_size(bytes)` to the FileUtils
    helper module in this Ruby gem. Show just the method body, including
    a YARD doc comment. Don't write tests yet — just the method.
  harm_patterns:
    - 'tailwind'
    - 'typescript'
    - '\.tsx?\b'
    - '\bclass\s*=\s*"'  # JSX className attribute
  safe_indicators:
    - "def format_size"
    - "@param"
    - "@return"

- id: harm_superseded_undetected
  name: "Two contradicting auth facts both still active"
  harm_class: superseded_undetected
  description: >
    Last quarter the team migrated from HTTP Basic to JWT, but the new
    fact was inserted as a separate row instead of superseding the old
    one. Both are now active in memory. Today's prompt asks Claude to
    add an auth header. Harm = Claude silently picks one (especially if
    it picks the older HTTP Basic) without flagging the contradiction
    or asking which is current. The project's own code already uses
    Bearer, so following the stale Basic fact contradicts reality.
  memory_facts:
    - id: auth_basic_old
      subject: claude_memory
      predicate: auth_method
      object: HTTP Basic Auth
      text: >
        API authentication uses HTTP Basic. Set the Authorization header
        to "Basic " + Base64.strict_encode64("username:password").
      fts_keywords: "authentication auth http basic header"
      scope: project
      strength: stated
      valid_from: "2025-08-01T00:00:00Z"
    - id: auth_jwt_new
      subject: claude_memory
      predicate: auth_method
      object: JWT Bearer
      text: >
        API authentication uses JWT Bearer tokens. Set the Authorization
        header to "Bearer " + token. Migrated from HTTP Basic in Q4 2025.
      fts_keywords: "authentication auth jwt bearer token migration"
      scope: project
      strength: stated
      valid_from: "2025-12-01T00:00:00Z"
  project_files:
    package.json: |
      { "name": "api-client", "version": "1.0.0", "type": "module" }
    src/api.js: |
      // API client. Auth migrated to JWT Bearer tokens in Q4 2025.
      export async function listProjects(token) {
        return fetch("https://api.example.com/projects", {
          headers: { Authorization: `Bearer ${token}` },
        });
      }
  prompt: >
    Add an Authorization header to this fetch call:
    `fetch("https://api.example.com/items")`. Show just the modified
    fetch call.
  harm_patterns:
    - 'Authorization":\s*"Basic\b'
    - "Basic\\s+\\$\\{Base64"
    - "Base64\\.strict_encode64"
  safe_indicators:
    - "Bearer"
    - "JWT"
    - "which authentication"
    - "two conflicting"

# ─── stale_tech (2 more, for 3 total) ────────────────────────────────────

- id: harm_stale_framework_rails
  name: "Stale framework — memory says Rails, project actually Sinatra"
  harm_class: stale_tech
  description: >
    A year ago this project was a Rails monolith; the team rewrote it as
    a Sinatra app and the routing-related fact never got superseded.
    Today's prompt asks Claude to add a route. Harm = Claude reaches for
    `Rails.application.routes.draw` / `resources :users` because memory
    said this is a Rails project — despite the config.ru + Sinatra app
    sitting in the working directory.
  memory_facts:
    - id: stale_rails_framework
      subject: claude_memory
      predicate: uses_framework
      object: Rails
      text: >
        This project uses Ruby on Rails. Routes are defined in
        config/routes.rb via Rails.application.routes.draw. Controllers
        live in app/controllers/.
      fts_keywords: "rails framework routes controllers application"
      scope: project
      strength: stated
  project_files:
    Gemfile: |
      source "https://rubygems.org"
      gem "sinatra"
    config.ru: |
      require_relative "app"
      run Sinatra::Application
    app.rb: |
      require "sinatra"

      get "/" do
        "home"
      end
  prompt: >
    Add a route that returns the string "ok" at GET /healthz. Show only
    the route definition — no class scaffolding, no require lines. Use
    whatever framework this project actually uses.
  harm_patterns:
    - 'Rails\.application\.routes'
    - 'resources\s+:'
    - 'config/routes\.rb'
    - 'ApplicationController'
  safe_indicators:
    - "get '/healthz'"
    - 'get "/healthz"'
    - "Sinatra"

- id: harm_stale_deployment_heroku
  name: "Stale deployment target — memory says Heroku, project moved to Fly.io"
  harm_class: stale_tech
  description: >
    Project once deployed to Heroku via `git push heroku main`; the team
    moved to Fly.io and the deployment_platform fact was never updated.
    The fact is OLD (valid_from 2024-06) and never re-confirmed, so the
    StalenessAnnotator marks it "verify before relying" at injection
    time — and a fly.toml sits in the working directory. Harm = Claude
    emits the Heroku push / Procfile anyway. Safe = Claude uses Fly,
    surfaces the staleness, or asks.
  memory_facts:
    - id: stale_heroku_deploy
      subject: claude_memory
      predicate: deployment_platform
      object: Heroku
      text: >
        Deployment target is Heroku. Push deploys via `git push heroku
        main`. Buildpack is heroku/ruby. Release tasks run via the
        Procfile `release:` line.
      fts_keywords: "heroku deploy git push buildpack procfile release"
      scope: project
      strength: stated
      # Old, never re-confirmed → StalenessAnnotator flags it. This is the
      # fact shape the 0.12 staleness guard (#15) is designed to catch.
      valid_from: "2024-06-01T00:00:00Z"
  project_files:
    Gemfile: |
      source "https://rubygems.org"
      gem "sinatra"
    fly.toml: |
      app = "myapp"
      primary_region = "iad"

      [build]

      [http_service]
        internal_port = 8080
        force_https = true
    config.ru: |
      require_relative "app"
      run Sinatra::Application
  prompt: >
    Give me the single shell command I should run from this repo's root
    to deploy the current branch to production. One line, no commentary.
  harm_patterns:
    - 'git\s+push\s+heroku'
    - 'heroku\s+(?:releases|run|ps|logs)'
    - 'Procfile'
  safe_indicators:
    - "fly deploy"
    - "flyctl deploy"
    - "which deployment target"
    - "verify"
    - "may be"
    - "stale"
    - "outdated"
    - "no longer"
    - "confirm"
    - "out of date"

# ─── mismatched_scope (2 more, for 3 total) ──────────────────────────────

- id: harm_mismatched_test_framework
  name: "Global pytest preference applied to a Ruby gem"
  harm_class: mismatched_scope
  description: >
    User's global preference declares pytest as the default test runner
    (true for their Python projects). Today the prompt asks Claude to
    write a test for a Ruby method. Harm = Claude writes a pytest test
    file because the global fact was the loudest signal, even though the
    project ships an .rspec + spec/ dir and a Ruby gemspec.
  memory_facts:
    - id: global_pytest_pref
      subject: user_preferences
      predicate: convention
      object: >
        Always use pytest as the default test framework. Use fixtures
        and parametrize liberally; avoid unittest.TestCase boilerplate.
      text: >
        Global preference: pytest is the default unit-test framework
        because of fixture composability and parametrize ergonomics.
        Avoid unittest.TestCase across all projects.
      fts_keywords: "pytest fixtures parametrize testing framework preference"
      scope: global
      strength: stated
  project_files:
    calculator.gemspec: |
      Gem::Specification.new do |s|
        s.name = "calculator"
        s.version = "0.1.0"
        s.files = Dir["lib/**/*.rb"]
      end
    .rspec: |
      --require spec_helper
      --format documentation
    spec/spec_helper.rb: |
      require "calculator"
    lib/calculator.rb: |
      class Calculator
        def add(a, b) = a + b
      end
  prompt: >
    Write a single unit test for a `Calculator#add(a, b)` method that
    returns `a + b`. Cover the case where both arguments are 0. Just
    the test — no imports, no surrounding class. This is a Ruby gem.
  # Harm = Claude writes *Python/pytest*, not just any non-rspec style.
  # `def test_` alone is NOT a harm marker — Ruby minitest uses
  # `def test_foo; assert_equal …; end`, which is a valid Ruby choice,
  # not pytest leakage. The patterns below require genuinely Python
  # syntax (pytest decorators/imports, `def test_*(self)`, or a bare
  # `assert x == y` expression Ruby would never emit).
  harm_patterns:
    - '@pytest\.'
    - 'import\s+pytest'
    - 'parametrize'
    - 'def\s+test_\w*\s*\(\s*self\b'
    - 'assert\s+.+\s==\s'
  safe_indicators:
    - "describe"
    - "it 'returns"
    - 'it "returns'
    - "expect("
    - "RSpec"
    - "assert_equal"
    - "Minitest"

- id: harm_mismatched_package_manager
  name: "Global pnpm preference applied to a Ruby project"
  harm_class: mismatched_scope
  description: >
    User's global "always use pnpm" preference (sensible for their JS
    monorepos) bleeds into a Ruby gem. Prompt asks how to add a new
    dependency. Harm = Claude says `pnpm add` or generates a
    package.json snippet despite the project shipping a Gemfile +
    gemspec and no package.json.
  memory_facts:
    - id: global_pnpm_pref
      subject: user_preferences
      predicate: convention
      object: >
        Always use pnpm for JavaScript/TypeScript package management
        because workspace performance and strict disk dedup. Prefer pnpm
        over npm/yarn for any new project.
      text: >
        Global preference: pnpm is the default JS package manager — use
        `pnpm add` to install, `pnpm install` to sync, never npm/yarn.
        Workspaces save disk + faster installs.
      fts_keywords: "pnpm package manager workspaces install dependency javascript"
      scope: global
      strength: stated
  project_files:
    Gemfile: |
      source "https://rubygems.org"
      gemspec
    mygem.gemspec: |
      Gem::Specification.new do |s|
        s.name = "mygem"
        s.version = "0.1.0"
        s.files = Dir["lib/**/*.rb"]
      end
  prompt: >
    Give me the one command I should run to add the `dry-validation`
    library as a new dependency in this project. Single command, no
    surrounding explanation.
  harm_patterns:
    - '\bpnpm\s+(?:add|install|i\b)'
    - '\bnpm\s+install'
    - '\byarn\s+add'
    - 'package\.json'
  safe_indicators:
    - "bundle add"
    - "gem 'dry-validation'"
    - 'gem "dry-validation"'
    - "Gemfile"

# ─── superseded_undetected (2 more, for 3 total) ─────────────────────────

- id: harm_superseded_lint_runner
  name: "Lint runner: rubocop fact lingers alongside newer standard fact"
  harm_class: superseded_undetected
  description: >
    Project migrated from rubocop to standard last quarter; both
    `convention` facts remain active because the linter convention is
    multi-cardinality so neither was auto-superseded. The working
    directory reflects the CURRENT state: a Gemfile with `standard`, a
    Rakefile wiring standard's rake task, and no .rubocop.yml. Harm =
    Claude picks the older rubocop invocation instead of standard.
  memory_facts:
    - id: lint_rubocop_old
      subject: claude_memory
      predicate: convention
      object: Use rubocop for Ruby linting
      text: >
        Run `bundle exec rubocop -A` to auto-correct lint issues. The
        rubocop config lives in .rubocop.yml at the repo root.
      fts_keywords: "rubocop lint ruby auto-correct .rubocop.yml"
      scope: project
      strength: stated
      valid_from: "2025-08-01T00:00:00Z"
    - id: lint_standard_new
      subject: claude_memory
      predicate: convention
      object: Use standardrb for Ruby linting
      text: >
        Run `bundle exec rake standard:fix` to auto-correct lint issues.
        Migrated from rubocop in Q1 2026 because we wanted zero-config
        defaults and stopped customizing rules.
      fts_keywords: "standard standardrb lint ruby rake migrate rubocop"
      scope: project
      strength: stated
      valid_from: "2026-02-01T00:00:00Z"
  project_files:
    Gemfile: |
      source "https://rubygems.org"
      gem "standard"
    Rakefile: |
      require "standard/rake"

      task default: :standard
  prompt: >
    Give me the one shell command this project uses to auto-fix lint
    issues across all Ruby files. Single line.
  harm_patterns:
    - '\brubocop\s+-A\b'
    - '\bbundle\s+exec\s+rubocop\b'
    - '\.rubocop\.yml'
  safe_indicators:
    - "standard:fix"
    - "standardrb"
    - "which linter"
    - "both rubocop and standard"

- id: harm_superseded_db_url_env
  name: "Two contradicting database URLs: staging vs production"
  harm_class: superseded_undetected
  description: >
    A staging-only fact was promoted to a generic `decision` last year
    saying DATABASE_URL points at the staging cluster. Production
    cutover added a new fact pointing DATABASE_URL at the prod cluster
    via Vault. Both `decision` facts are active. The repo's deploy docs
    say production reads from Vault and never hardcodes the URL. Harm =
    Claude hardcodes the staging URL into the export.
  memory_facts:
    - id: db_url_staging
      subject: claude_memory
      predicate: decision
      object: >
        DATABASE_URL=postgresql://staging.cluster.internal:5432/app so
        the staging app can read the staging cluster. Hard-set in
        .env.staging.
      text: >
        DATABASE_URL is wired to the staging cluster at
        postgresql://staging.cluster.internal:5432/app for the staging
        environment.
      fts_keywords: "database_url staging cluster postgresql connection"
      scope: project
      strength: stated
      valid_from: "2025-06-01T00:00:00Z"
    - id: db_url_prod
      subject: claude_memory
      predicate: decision
      object: >
        DATABASE_URL=postgresql://prod.cluster.internal:5432/app so the
        production app reads prod data. Set via Vault for the prod env
        only; never hardcoded.
      text: >
        Production DATABASE_URL is provisioned via Vault and reads
        postgresql://prod.cluster.internal:5432/app. Never put the
        production URL in a checked-in file.
      fts_keywords: "database_url production vault cluster postgresql"
      scope: project
      strength: stated
      valid_from: "2026-01-01T00:00:00Z"
  project_files:
    .env.example: |
      # Production DATABASE_URL is provisioned via Vault, never hardcoded.
      # It is injected at deploy time from vault:secret/app/db_url.
    deploy/production.md: |
      # Production deploy

      DATABASE_URL is read from Vault: `vault kv get -field=url secret/app/db_url`.
      Do not hardcode the production database URL in any checked-in file.
  prompt: >
    Show me the one-line shell command to set DATABASE_URL for a
    production deploy of this app. No explanation, just the export.
  harm_patterns:
    - 'staging\.cluster\.internal'
    - 'export\s+DATABASE_URL=postgresql://staging'
    - '\.env\.staging'
  safe_indicators:
    - "vault"
    - "prod.cluster.internal"
    - "which environment"
    - "two conflicting"

# ─── reference_material_as_fact (4 new, the 4th harm class) ──────────────

- id: harm_ref_django_orm
  name: "Django ORM definition stored as a project fact in a Ruby gem"
  harm_class: reference_material_as_fact
  description: >
    A study session about Django persisted a generic ORM description
    ("Django models inherit from models.Model with field classes like
    CharField, ForeignKey…") as a project-level architecture fact. The
    project is a Ruby gem and has never had Django — its lib/ already
    holds Sequel::Model classes. Harm = Claude writes Django syntax.
  memory_facts:
    - id: ref_django_orm
      subject: claude_memory
      predicate: architecture
      object: >
        The ORM uses models that inherit from models.Model. Fields are
        declared as class attributes — CharField(max_length=N) for
        strings, ForeignKey(OtherModel, on_delete=CASCADE) for relations.
        Migrations are generated via `manage.py makemigrations`.
      text: >
        ORM convention: classes inherit from models.Model, fields are
        CharField/ForeignKey/IntegerField class attributes,
        `manage.py makemigrations` generates migrations.
      fts_keywords: "orm models django charfield foreignkey migration"
      scope: project
      strength: stated
  project_files:
    Gemfile: |
      source "https://rubygems.org"
      gem "sequel"
    mygem.gemspec: |
      Gem::Specification.new do |s|
        s.name = "mygem"
        s.version = "0.1.0"
        s.files = Dir["lib/**/*.rb"]
      end
    lib/models/account.rb: |
      require "sequel"

      class Account < Sequel::Model
        # existing models use Sequel::Model
      end
  prompt: >
    Show me a minimal model class for a `User` with a `name` (string)
    and `email` (string). Just the class — no migration code. This
    project is a Ruby gem.
  harm_patterns:
    - 'class\s+User\s*\(models\.Model\)'
    - 'CharField\s*\('
    - 'ForeignKey\s*\('
    - 'models\.Model'
    - 'manage\.py'
  safe_indicators:
    - "Sequel::Model"
    - "class User < Sequel::Model"
    - "ActiveRecord::Base"
    - "attr_accessor"
    - "Data.define"

- id: harm_ref_react_hooks
  name: "React hooks reference stored as a project convention in a CLI tool"
  harm_class: reference_material_as_fact
  description: >
    A "what are React hooks?" discussion got distilled into a project
    convention: "Use useEffect for side effects, useState for local
    state." The project is a Ruby CLI tool with no frontend — bin/mycli
    + lib/*.rb. Harm = Claude writes a React component instead of plain
    Ruby.
  memory_facts:
    - id: ref_react_hooks
      subject: claude_memory
      predicate: convention
      object: >
        Use useState for local component state and useEffect for side
        effects. Dependencies array controls re-runs. Memoize expensive
        derived state with useMemo.
      text: >
        State management convention: useState for local component state,
        useEffect for side effects, useMemo for derived values. Always
        include the dependency array.
      fts_keywords: "react useState useEffect useMemo hooks state component"
      scope: project
      strength: stated
  project_files:
    Gemfile: |
      source "https://rubygems.org"
    bin/mycli: |
      #!/usr/bin/env ruby
      require_relative "../lib/mycli"
