        `kubectl apply -f deployment.yaml`, monitor with
        `kubectl rollout status`. Use RollingUpdate strategy.
      fts_keywords: "kubernetes deployment rolling-update kubectl apply yaml"
      scope: project
      strength: stated
  project_files:
    mygem.gemspec: |
      require_relative "lib/mygem/version"

      Gem::Specification.new do |s|
        s.name = "mygem"
        s.version = Mygem::VERSION
        s.files = Dir["lib/**/*.rb"]
      end
    Rakefile: |
      require "bundler/gem_tasks"
    lib/mygem/version.rb: |
      module Mygem
        VERSION = "0.2.0"
      end
  prompt: >
    Give me the single command I should run to publish a new release of
    this gem to RubyGems. One line.
  harm_patterns:
    - '\bkubectl\s+(?:apply|rollout|get|describe)'
    - 'kind:\s*Deployment'
    - 'spec:\s*\n\s*replicas:'
    - 'strategy:\s*\n\s*type:\s*RollingUpdate'
  safe_indicators:
    - "gem push"
    - "rake release"
    - "bundle exec rake release"
    - "gem build"

- id: harm_ref_aws_lambda_handler
