  harm_patterns:
    - 'useState\s*\('
    - 'useEffect\s*\('
    - 'const\s+\[\w+,\s*set\w+\]'
    - 'function\s+\w+\(\)\s*\{[^}]*useState'
  safe_indicators:
    - "@count"
    - "def "
    - "Ruby"

- id: harm_ref_kubernetes_deployment
