  harm_class: reference_material_as_fact
  description: >
    Reference text about AWS Lambda ("handlers are functions invoked by
    API Gateway / S3 events; cold-start latency is bounded by package
    size") got distilled as project architecture. The project is a
    local Ruby CLI/server — bin/server + a webrick-based lib — with no
    AWS. Harm = Claude scaffolds a Lambda handler instead of a local
