# DevMemEval End-to-End Scenarios
# ~30 scenarios across LongMemEval's 5 memory ability categories
#
# Abilities:
#   information_extraction    - Can the system recall specific stored facts?
#   multi_session_reasoning   - Can it synthesize across multiple facts?
#   temporal_reasoning        - Can it handle time-ordered knowledge?
#   knowledge_update          - Does it prefer newer facts over superseded ones?
#   abstention                - Does it correctly say "I don't know"?

# ============================================================
# INFORMATION EXTRACTION (~8 scenarios)
# ============================================================

- id: e2e_ext_001
  ability: information_extraction
  name: "Tech stack recall"
  facts_to_load:
    - {id: ts_db_001, predicate: uses_database, object: "PostgreSQL 15 for primary relational data storage", text: "We use PostgreSQL 15 as our primary database for all relational data.", fts_keywords: "database sql relational storage postgres"}
    - {id: ts_fw_001, predicate: uses_framework, object: "Ruby on Rails 7.1 for the API backend", text: "The API is built on Ruby on Rails 7.1 in API-only mode.", fts_keywords: "framework rails ruby backend api"}
    - {id: ts_fw_010, predicate: uses_framework, object: "Sequel (~> 5.0) for database access", text: "This project uses Sequel for database access, not ActiveRecord.", fts_keywords: "sequel orm database access ruby"}
  prompt: "What database and ORM does this project use?"
  acceptance_keywords: ["PostgreSQL", "Sequel"]
  rejection_keywords: ["ActiveRecord", "MySQL", "MongoDB"]
  threshold: 1.0

- id: e2e_ext_002
  ability: information_extraction
  name: "Convention recall"
  facts_to_load:
    - {id: cv_ruby_001, predicate: convention, object: "Use frozen_string_literal: true in all Ruby files", text: "All Ruby files must include frozen_string_literal: true.", fts_keywords: "convention style ruby frozen string"}
    - {id: cv_ruby_003, predicate: convention, object: "Prefer expect syntax over should in RSpec", text: "Tests must use RSpec's expect syntax. The should syntax is disabled.", fts_keywords: "convention rspec expect should testing"}
  prompt: "What are the Ruby coding conventions for this project?"
  acceptance_keywords: ["frozen_string_literal", "expect"]
  rejection_keywords: ["should syntax"]
  threshold: 0.75

- id: e2e_ext_003
  ability: information_extraction
  name: "Decision recall"
  facts_to_load:
    - {id: dc_001, predicate: decision, object: "Use Result objects (Success/Failure) instead of exceptions", text: "We decided to use Result objects for error handling instead of raising exceptions.", fts_keywords: "decision error handling result pattern"}
  prompt: "How does this project handle errors?"
  acceptance_keywords: ["Result", "Success", "Failure"]
  rejection_keywords: ["exceptions", "raise"]
  threshold: 0.5

- id: e2e_ext_004
  ability: information_extraction
  name: "Auth method recall"
  facts_to_load:
    - {id: au_001, predicate: auth_method, object: "JWT tokens with 15-minute expiry and refresh rotation", text: "Authentication uses JWT tokens with 15-minute access token expiry and automatic refresh rotation.", fts_keywords: "authentication jwt token refresh rotation"}
  prompt: "How does user authentication work in this API?"
  acceptance_keywords: ["JWT", "refresh"]
  rejection_keywords: ["cookie", "session", "Basic"]
  threshold: 1.0

- id: e2e_ext_005
  ability: information_extraction
  name: "Deployment platform recall"
  facts_to_load:
    - {id: dp_001, predicate: deployment_platform, object: "AWS ECS Fargate with blue-green deployments", text: "The API runs on AWS ECS Fargate with blue-green deployment strategy.", fts_keywords: "deployment aws ecs fargate blue green"}
  prompt: "Where is this application deployed?"
  acceptance_keywords: ["ECS", "Fargate"]
  rejection_keywords: ["Heroku", "Lambda"]
  threshold: 1.0

- id: e2e_ext_006
  ability: information_extraction
  name: "Testing framework recall"
  facts_to_load:
    - {id: ts_fw_011, predicate: uses_framework, object: "RSpec for testing", text: "All tests are written in RSpec with expect syntax and documentation formatter.", fts_keywords: "rspec testing test framework ruby"}
    - {id: cv_ruby_003, predicate: convention, object: "Prefer expect syntax over should in RSpec", text: "Tests use RSpec's expect syntax.", fts_keywords: "convention rspec expect"}
  prompt: "What testing framework and syntax does this Ruby project use?"
  acceptance_keywords: ["RSpec", "expect"]
  rejection_keywords: ["Minitest", "should"]
  threshold: 1.0

- id: e2e_ext_007
  ability: information_extraction
  name: "Database access layer recall"
  facts_to_load:
    - {id: ts_fw_010, predicate: uses_framework, object: "Sequel (~> 5.0) for database access", text: "This project uses Sequel for database access, not ActiveRecord.", fts_keywords: "sequel orm database access ruby"}
    - {id: cv_ruby_004, predicate: convention, object: "Use Sequel dataset methods instead of raw SQL", text: "Always use Sequel's dataset methods. Avoid raw SQL.", fts_keywords: "convention sequel sql database query"}
  prompt: "What ORM does this project use and what are the query conventions?"
  acceptance_keywords: ["Sequel", "dataset"]
  rejection_keywords: ["ActiveRecord", "raw SQL"]
  threshold: 0.75

- id: e2e_ext_008
  ability: information_extraction
  name: "Design pattern recall"
  facts_to_load:
    - {id: cv_ruby_009, predicate: convention, object: "Domain objects must be immutable (frozen)", text: "All domain objects are frozen after initialization.", fts_keywords: "convention immutable frozen domain"}
    - {id: cv_ruby_010, predicate: convention, object: "Use null objects instead of nil checks", text: "Use NullFact, NullExplanation etc. instead of nil checks.", fts_keywords: "convention null object pattern nil"}
  prompt: "What design patterns does this project use for domain objects?"
  acceptance_keywords: ["immutable", "null object"]
  rejection_keywords: []
  threshold: 0.75

