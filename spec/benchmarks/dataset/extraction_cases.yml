# Distillation Extraction Quality Dataset
# ~30 annotated cases for measuring NullDistiller extraction accuracy.
#
# Categories: entity (~12), fact (~18)
#
# NullDistiller-specific: regex-based extraction always outputs lowercase names.
# Future LLM distillers will need an expanded dataset with more nuanced cases.
#
# Expected format:
#   entities: [{type: <type>, name: <lowercase_name>}]
#   facts: [{predicate: <pred>, object: <lowercase_name>, scope_hint: <scope>}]
# Missing arrays default to [].

# ============================================================
# ENTITY RECOGNITION (~12 cases)
# ============================================================

# --- Database entities ---

- id: ext_ent_db_postgresql
  category: entity
  text: "We use PostgreSQL as our primary database for all relational data."
  concepts:
    - postgresql
  expected:
    entities:
      - {type: database, name: postgresql}
    facts:
      - {predicate: uses_database, object: postgresql}

