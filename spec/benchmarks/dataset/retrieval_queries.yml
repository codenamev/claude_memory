# DevMemBench Retrieval Queries
#
# Wrapped in <no-memory> tags so transcripts that capture this file's
# content skip ingestion — the queries reference fixture facts that
# would otherwise be re-extracted as project facts.
# Ingest::Ingester::EXCLUSION_TAGS excludes the entire delta on <no-memory>.
#
# <no-memory>
#
# ~150 queries organized by difficulty level
#
# Difficulty levels:
#   easy       - Keywords overlap with fact text (FTS5 should handle)
#   medium     - Semantic match, different words (embedding should help)
#   hard       - Cross-category or multi-fact reasoning
#   abstention - Should return no relevant results
#   temporal   - Newer fact should rank higher than superseded
#   scope      - Tests project vs global ranking

