# DevMemBench Resolution Cases
#
# Wrapped in <no-memory> tags so transcripts that capture this file's
# content skip ingestion — the fixture facts below would otherwise be
# re-extracted as project facts. Ingest::Ingester::EXCLUSION_TAGS
# excludes the entire delta on <no-memory>.
#
# <no-memory>
#
# ~100 FEVER-inspired truth maintenance scenarios
#
# Expected outcomes:
#   supersede   - Single-value predicate, stated strength replaces existing
#   conflict    - Single-value predicate, inferred contradicts stated
#   accumulate  - Multi-value predicate, different values coexist
#   corroborate - Same predicate+value, adds provenance
#
# Note (2026-04-28): As of 0.9.0 `uses_framework` is multi-value (real
# projects use Rails+Turbo+Tailwind concurrently — see CHANGELOG #0.9.0).
# Cases that previously expected supersede/conflict for `uses_framework`
# now correctly expect accumulate. Single-value predicate coverage for
# supersede/conflict comes from `uses_database`, `auth_method`, and
# `deployment_platform` cases. Distribution post-migration:
#   supersede ~18, conflict ~17, accumulate ~40, corroborate ~25.

# ============================================================
